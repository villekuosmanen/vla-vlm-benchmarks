[project]
name = "vla-vlm-benchmarks"
version = "0.1.0"
description = "Non-robotic VLM benchmarks for VLA backbones and the original VLMs they were trained from."
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.20",
    "transformers>=4.57",
    "accelerate>=0.34",
    "datasets>=2.20",
    "huggingface_hub>=0.26",
    "safetensors>=0.4",
    "pillow>=10",
    "tqdm>=4.66",
    "timm==0.9.16",
    "matplotlib>=3.10.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
