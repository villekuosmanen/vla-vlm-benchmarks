[project]
name = "vla-vlm-benchmarks-prismatic"
version = "0.1.0"
description = "Runs the OpenVLA / Prismatic pair with the dependency pins OpenVLA's remote code checks for."
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.15.0",
    "torchvision==0.29.2",
    "transformers==4.40.1",
    "tokenizers==0.19.1",
    "timm==0.9.16",
    "numpy<2",
    "pyarrow>=15,<20",
    "accelerate>=0.26,<1.0",
    "datasets>=2.20",
    "huggingface_hub>=0.23,<1.0",
    "safetensors>=0.4",
    "sentencepiece>=0.1.99",
    "pillow>=10",
    "tqdm>=4.66",
]

[tool.uv]
package = false
